name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  searxng-pii-proxy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: searxng-pii-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest -v

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate compose.yaml parses without needing real secrets/env values
      - name: Validate compose.yaml
        run: |
          mkdir -p secrets
          for f in webui_secret_key mcpo_api_key open_terminal_api_key hf_token; do
            echo "placeholder" > "secrets/$f"
          done
          VAULT_HOST_PATH=/tmp docker compose -f compose.yaml config -q
